name: 更新 xiaoguo.json（PY）

# 只在 xiaoguopy/ 变动时自动跑，也可以在 Actions 页面手动 Run。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'xiaoguopy/**'
      - 'scripts/update_xiaoguo.py'
      - '.github/workflows/update-xiaoguo-py.yml'

permissions:
  contents: write

# 与 JS 工作流共用同一组：改 scripts/update_xiaoguo.py 时两边都会跑，
# 并行 push 会互相顶掉（non-fast-forward），所以排队执行。
concurrency:
  group: update-xiaoguo
  cancel-in-progress: false

jobs:
  update:
    # 机器人自己提交后触发的第二轮直接跳过，省一次空跑。
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成 xiaoguo.json
        run: python scripts/update_xiaoguo.py xiaoguopy .py

      - name: 校验清单
        run: python scripts/update_xiaoguo.py xiaoguopy .py --check

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain xiaoguopy/xiaoguo.json)" ]; then
            echo "xiaoguo.json 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xiaoguopy/xiaoguo.json
          git commit -m "chore(xiaoguopy): 自动更新 xiaoguo.json"
          git push
